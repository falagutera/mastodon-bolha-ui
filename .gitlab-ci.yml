# Checks the theme on every push: the SCSS compiles, dist/ matches the sources, install.sh
# works on a fake Mastodon tree, plus the shared security stage (open/gcn/ci-templates).
include:
  - project: 'open/gcn/ci-templates'
    file: '/security.yml'
    ref: main
stages: [security, test, deploy]

sass:
  stage: test
  image: node:22-alpine
  script:
    # application.scss is Mastodon's own; a stub stands in for it.
    - npx --yes sass@1.93.2 --no-source-map --load-path=ci/stub src/app/javascript/styles/bolha-ui.scss > /tmp/bolha-ui.css
    - npx --yes sass@1.93.2 --no-source-map --load-path=ci/stub src/app/javascript/styles/bolha-ui-gcn.scss > /tmp/bolha-ui-gcn.css
    - "grep -q 'font-family: \"Ubuntu\"' /tmp/bolha-ui.css"
    - grep -q -- '--b-accent-d:#FF4D5E' /tmp/bolha-ui-gcn.css

dist:
  stage: test
  image: alpine:3.22
  script:
    - scripts/build-dist.sh --check

install:
  stage: test
  image: alpine:3.22
  script:
    - scripts/test-install.sh

# On a vX.Y.Z tag: the release tarball, with the version X.Y.Z-BUILD (BUILD = this pipeline's
# number) built into the theme and the plain-CSS files. It is a job artifact kept forever; the
# README installs from it. The tag must match VERSION.
release:
  stage: test
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - test "$CI_COMMIT_TAG" = "v$(cat VERSION)" || { echo "tag $CI_COMMIT_TAG does not match VERSION $(cat VERSION)"; exit 1; }
    - scripts/build-dist.sh --check
    - export BUILD=$CI_PIPELINE_ID
    - scripts/build-dist.sh
    - echo "$BUILD" > BUILD
    - full="$(cat VERSION)-$BUILD"
    - mkdir -p "/tmp/mastodon-bolha-ui-$full"
    - cp -R install.sh VERSION BUILD CHANGELOG.md LICENSE README.md README.pt-BR.md dist src "/tmp/mastodon-bolha-ui-$full/"
    - tar -C /tmp -czf mastodon-bolha-ui.tar.gz "mastodon-bolha-ui-$full"
    - grep -q "Bolha UI $full" "/tmp/mastodon-bolha-ui-$full/src/app/javascript/styles/bolha-ui/_version.scss"
  artifacts:
    name: mastodon-bolha-ui-$CI_COMMIT_TAG
    paths: [mastodon-bolha-ui.tar.gz]
    expire_in: never

# ui.bolha.us: the theme's page, built from VERSION, CHANGELOG.md and screenshots/ (site/build.py).
pages:
  stage: deploy
  image: python:3.13-alpine
  script:
    - python3 site/build.py public
  artifacts:
    paths: [public]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
